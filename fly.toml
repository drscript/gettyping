# fly.toml app configuration file generated for gettyping on 2026-08-10T09:08:32+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gettyping'
primary_region = 'iad'

[env]
  DATABASE_PATH = '/data/gettyping.sqlite'
  NODE_ENV = 'production'
  ADDRESS_HEADER = 'Fly-Client-IP'

[[mounts]]
  source = 'gettyping_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
